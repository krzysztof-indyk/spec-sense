schema_version: "1.0"

preset:
  id: "spec-sense"
  name: "SpecSense — Standard Spec Kit"
  version: "0.6.0"
  description: "SDDW interactive gates and approved Decision Handoff for eight standard Spec Kit commands (no Lean)"
  author: "Community adaptation (unofficial)"
  license: "MIT"

requires:
  speckit_version: ">=0.6.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Standard specify with interactive discovery and approval before writing"
      replaces: "speckit.specify"
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Standard clarify with one question at a time and approved updates"
      replaces: "speckit.clarify"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Standard plan with approved technical decisions before generation"
      replaces: "speckit.plan"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Standard tasks.md, phase/user-story group approvals before writing"
      replaces: "speckit.tasks"
      strategy: "wrap"
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Standard constitution, per-principle approvals and downstream impact proposals"
      replaces: "speckit.constitution"
      strategy: "wrap"

    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Convergence: evidence-backed gaps reviewed by groups before append-only tasks.md write"
      replaces: "speckit.converge"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Read-only cross-artifact analysis with one-at-a-time review of material findings"
      replaces: "speckit.analyze"
      strategy: "wrap"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Requirements-quality checklist: scope discovery and category-by-category approval"
      replaces: "speckit.checklist"
      strategy: "wrap"

tags:
  - "sddw"
  - "interactive"
  - "copilot"
  - "discovery"
  - "standard-workflow"
  - "governance"
